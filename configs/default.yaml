# StreamRAG default configuration — Phase 3 (corpus & retrieval foundation).
# Every value here is a team engineering default, NOT an official Samsung threshold.
# Values marked "provisional" must be re-validated once the official corpus is available.

paths:
  corpus: ./corpus               # official corpus location (git-ignored). Override: --corpus or STREAMRAG_CORPUS
  index_root: ./indexes
  models_dir: ./models
  model_registry: ./configs/models.yaml
  runs_dir: ./runs

corpus:
  include_extensions: [".txt", ".md", ".pdf"]   # adapters implemented; add more only if the corpus needs them
  fixture_marker: TEST_FIXTURE_ONLY             # a corpus dir containing this file is a test fixture
  on_invalid_document: skip                     # skip (recorded in manifest) | error
  doc_id_strategy: native_or_stem               # native_or_stem | native_or_ordinal
  native_doc_id_pattern: "^(?i:doc)[ _-]?(\\d+)"
  # Phase 9: front-matter fields kept as (sanitised, untrusted) document metadata - filters and validity only
  metadata_fields: [version, effective_date, published_date, valid_until, status, supersedes, doc_type,
                    applicant_type, country, region, year, product, language]

normalization:
  unicode_form: NFKC
  dehyphenate: true
  join_wrapped_lines: true
  strip_page_numbers: true
  strip_repeated_headers_footers: true
  header_footer_min_pages: 3
  header_footer_min_fraction: 0.6

sections:
  markdown_headings: true
  numbered_headings: true
  caps_headings: true          # only used when a document has no markdown/numbered headings
  max_heading_words: 12
  pdf_page_sections_when_no_headings: true

chunking:                      # provisional — see research/phase3/chunking_report.md
  strategy: paragraph          # section | paragraph | token
  target_tokens: 180           # tokens = regex words (\w+); ~1.2-1.4 wordpieces each
  max_tokens: 300
  overlap_tokens: 40           # paragraph: whole trailing sentences; token: sliding window overlap
  min_tokens: 25
  keep_lead_in_with_list: true

ids:
  chunk_id_template: "{document_id}§{section_id}#{part}"
  citation_template: "{document_id} §{section_id}"

index_text:
  template: "{header}: {text}"   # header = document title > section path (deduplicated); indexed by BM25 + dense

lexical:
  k1: 1.5
  b: 0.75
  stemming: snowball           # snowball | none
  stopwords: stopwords_en.txt  # generic English list in src/streamrag/resources
  normalize_number_words: true

dense:
  embedder: bge-small-en-v1.5  # registry name in configs/models.yaml, or "hashing" (TEST/OFFLINE ONLY, not semantic)
  batch_size: 8                # measured: same throughput as 32, ~half the peak RSS (research/phase3)
  intra_op_threads: 0          # 0 = onnxruntime default

retrieval:
  mode: hybrid                 # bm25 | dense | hybrid
  top_k: 10
  lexical_k: 50
  dense_k: 50
  rrf_k: 60
  dense_min_similarity: null   # optional similarity cut-off (null = none); model-specific, calibrate first
  on_dense_failure: degrade    # degrade (lexical-only, flagged in EvidenceSet.warnings) | error
  dense_timeout_ms: 1000

dedup:
  enabled: true
  near_duplicates: true
  near_dup_cosine: 0.97        # provisional (Phase 2 default); validated only on fixtures so far
  near_dup_jaccard: 0.9
  overlap_merge_ratio: 0.8     # merge overlapping same-section chunks only if overlap >= 80% of the shorter

rerank:
  enabled: false               # ablation switch; adoption pending Exp 3 on real labels
  model: ms-marco-minilm-l6-v2
  rerank_k: 20
  timeout_ms: 600
  batch_size: 32

telemetry:
  log_level: INFO
  log_format: json             # json | text

# --------------------------------------------------------------------------------------------------
# Phase 4: streaming engine + retrieval controller. One canonical schema; names map to Phase 2 §8/§25.3.
# All values are team engineering defaults (NOT official thresholds), set from Phase 2 design reasoning,
# not tuned on any evaluation data.
controller:
  strategy: rules                  # rules (controller) | end_only (ablation A) | every_chunk (ablation B)
  act_classifier: rules            # rules | prototype (embedding nearest-centroid; Exp 8 ablation)
  lexicon: ./configs/controller_lexicon.yaml
  min_content_tokens: 2            # Phase 2 sufficiency: >= 2 content tokens ...
  anchor_idf_floor: 1.0            # ... and >= 1 corpus-vocabulary term with IDF >= floor (Phase 2 idf_floor)
  strong_anchor_strength: 0.8      # ... or a single very rare corpus term (anchor_strength >= this) is enough
  min_stability: 0.65              # semantic-stability score needed for a provisional RETRIEVE
  min_worthiness: 0.5              # retrieval-worthiness score needed (provisional) / to retrieve UNKNOWN acts at end
  act_suppress_confidence: 0.8     # SKIP suppressed acts only when this confident (Phase 2 act_suppress_confidence)
  stability_quiet_ms: 600          # no new words for this long => quiet tick re-evaluates (Phase 2 Δt_stable)
  novelty_threshold: 0.25          # SKIP as redundant if 1 - max term-Jaccard vs prior queries < this
  retrieval_cooldown_ms: 400       # min stream-time gap between provisional RETRIEVE decisions (Phase 2 min_interval)
  max_retrievals_per_utterance: 4  # Phase 2 provisional_budget; one slot reserved for the final query
  reserve_final_retrieval: true
  allow_parallel_retrieval: true
  max_concurrent_retrievals: 2
  cancel_superseded: queued_only   # never | queued_only (running retrievals always complete; see docs/streaming/06)
  endpoint_timeout_ms: 3000        # fallback only: no chunk/UTTERANCE_END this long => finalize(reason=timeout).
                                   # Phase 2 said 2000; raised because 5-6-word chunks @2.6 wps (+jitter) arrive up to
                                   # 2.10-2.13 s apart and 2000 truncated a dev-suite utterance (Phase 4 report §17)

streaming:
  mode: virtual                    # virtual (deterministic discrete-event) | realtime (asyncio + wall clock)
  speed: 1.0                       # realtime only: >1 compresses the input timeline
  sim_retrieval_latency_ms: 10     # virtual mode: modeled retrieval latency (Phase 3 measured hybrid p95 ~5.6 ms)
  retrieval_timeout_ms: 2000
  retrieval_mode: hybrid
  top_k: 10
  rerank: false
  words_per_second: 2.6            # simulator: speaking rate used to time chunks
  end_gap_ms: 500                  # simulator: silence between last chunk and UTTERANCE_END (guide example: 0.5 s)

# --------------------------------------------------------------------------------------------------
# Phase 5: multi-intent decomposition, per-intent retrieval and evidence fusion (docs/multi_intent/).
# Team engineering defaults (NOT official thresholds). Values marked [measured] were chosen from the Phase 5
# dev-suite experiments in research/phase5 (fixture domain; see PHASE_5_MULTI_INTENT_REPORT.md).
multi_intent:
  enabled: false                   # true: the streaming session decomposes intents and retrieves per intent
  lexicon: ./configs/intent_lexicon.yaml
  max_intents: 4                   # active intents per utterance; extra intents are ranked and dropped with a reason
  max_queries_per_utterance: 10
  max_queries_per_intent: 3        # provisional + refined + final
  max_candidates_per_intent: 5     # top_k per intent retrieval
  max_concurrent_retrievals: 3
  dispatch: parallel               # parallel | sequential | batched
  intent_cooldown_ms: 400          # same as Phase 4 retrieval_cooldown_ms, applied per intent
  duplicate_jaccard: 0.8           # Phase 2 §9.5 intra-set duplicate rule (lexical Jaccard >= 0.8)
  match_jaccard: 0.5               # version tracking: a new draft intent continues an existing one
  refine_containment: 0.6          # query relation 'refines' (Phase 4 value)
  carryover: true                  # anaphora + follow-up ellipsis inherit context from earlier intents
  llm_check: "off"                 # off | gated (Phase 2 §9.6); no LLM backend is configured (ADR-007 Q2 open)
  llm_check_wait_ms: 300

fusion:
  strategy: intent_aware           # concat | global_score | rrf | intent_aware (ADR-009 quota round-robin)
  top_k: 8                         # unified evidence items
  min_per_intent: 2                # coverage floor per intent
  section_cap_per_intent: 2        # ADR-009
  rrf_k: 60
  rerank: none                     # none | intent_ce | cross_intent_dense | cross_intent_ce
  rerank_k: 20
  conflict_check: true             # conservative typed-value check (numbers/units across documents)

# --------------------------------------------------------------------------------------------------
# Phase 6: session memory, late-arriving details, delta retrieval, claim/answer state (docs/session/).
# Team engineering defaults (NOT official thresholds); see PHASE_6_ADAPTIVE_RAG_REPORT.md.
session:
  enabled: false                   # true (with multi_intent.enabled): versioned session state + delta planning
  transcript_window: 6             # utterances kept verbatim; older ones survive only as structured state
  redact_pii: true                 # e-mails, phone/card-like numbers and key-like tokens are never stored
  delta_scope: corpus              # corpus | session_docs_first (spec §14 step 3; measured in research/phase6)
  cache: true                      # semantic retrieval cache: key = analyzed term set + options + index hash
  frame_overlap_min: 1             # a new need sharing >= this many topic terms stays in the current frame
  claims_per_intent: 4             # extractive claims registered per intent version
  claim_min_relevance: 0.2         # min share of the intent's query terms a claim sentence must contain

# --------------------------------------------------------------------------------------------------
# Phase 7: grounded answer generation + claim verification + citations (docs/answer/, ADR-017).
# Team engineering defaults (NOT official thresholds); see PHASE_7_GROUNDED_GENERATION_REPORT.md.
generation:
  enabled: false                   # true (with session.enabled): grounded answers at the end of every turn
  backend: auto                    # auto | ollama | extractive  (auto: ollama if reachable, else extractive)
  ollama_url: http://127.0.0.1:11434
  model: qwen3:4b                  # local small instruct model (ADR-007 local adapter)
  temperature: 0.0
  seed: 7
  num_ctx: 8192
  max_output_tokens: 1024
  timeout_s: 120
  max_structured_retries: 1        # schema-invalid JSON is re-asked at most this often, then extractive fallback
  detail: detailed                 # concise | detailed
  max_claims_per_section: 6
  verifier: nli                    # nli (entailment cross-encoder + rules) | rules (L0-L2 only)
  nli_model: nli-deberta-v3-xsmall # configs/models.yaml (fetched with `streamrag fetch-models`)
  validation_mode: strict          # strict: any unsupported factual claim blocks finalization; relaxed: critical only
  repair: true                     # relabel / keep supported atoms / qualify as "not established"
  llm_repair: false                # rewrite unsupported claims with one extra LLM call (ablation)
  max_validation_retrievals: 1     # retrieval fallback for unsupported critical claims, per answer version
  max_answer_revision_attempts: 2
  draft_mode: extractive           # off | extractive: verified extractive drafts while the user is still speaking

# --------------------------------------------------------------------------------------------------
# Phase 8: streaming runtime (docs/runtime/, ADR-018). Team engineering defaults (NOT official thresholds);
# see PHASE_8_STREAMING_RUNTIME_REPORT.md. Only `streamrag.runtime.StreamingRuntime` reads this section.
runtime:
  max_concurrent_sessions: 8
  max_concurrent_retrievals: 4     # retrieval worker threads (lexical / dense subtasks), shared by all sessions
  max_concurrent_llm_calls: 1      # the local Ollama server runs one request at a time (OLLAMA_NUM_PARALLEL=1)
  max_concurrent_cpu: 2            # assembly and drafts (NLI verification)
  queues: {input: 64, retrieval: 64, llm: 8, cpu: 32, output: 4096}
  timeouts_ms: {lexical: 2000, dense: 3000, assemble: 2000, generation: 60000, draft: 10000, validation_retrieval: 3000}
  retry: {max_retries: 2, initial_delay_ms: 50, max_delay_ms: 1000, multiplier: 2.0, jitter: 0.2, seed: 7}
  priorities: {final_answer: 0, retrieval_final: 1, validation_retrieval: 1, retrieval_provisional: 2, draft: 2,
               analytics: 3, aging_ms: 500}
  budget: {turn_ms: 30000, generation_reserve_ms: 4200, validation_reserve_ms: 400}   # reserves = Phase 7 p95
  sim_latency_ms: {lexical: 20, dense: 40, assemble: 2, generation: 2000, draft: 50, validation_retrieval: 30}
  split_retrieval: true            # lexical and dense run as concurrent subtasks (RETRIEVAL_PARTIAL)
  coalescing_window_ms: 0          # 0: coalesce only deltas already queued (adaptive batching under load)
  cancel_running: true             # superseded running work is signalled to stop (cooperative cancellation)
  cancel_on_correction: true       # a correction cancels the previous turn's in-flight answer (spec §7.3 barge-in)
  output_max_hold_ms: 2000
  shutdown_grace_ms: 5000
  max_chunk_chars: 4000
  max_inputs_per_session: 20000

# Phase 9: adaptive retrieval intelligence (docs/retrieval/01_query_analysis.md ... 11_budget_management.md,
# docs/architecture/13_adaptive_retrieval.md). Off by default; team engineering values calibrated on the dev
# fixture suites (research/phase9) - NOT REPORTABLE. Corpus text never changes any of these.
adaptive_retrieval:
  enabled: false
  lexicon: configs/retrieval_lexicon.yaml
  initial_k: {SIMPLE: 3, MODERATE: 5, COMPLEX: 5, MULTI_HOP: 5}
  k_schedule: [5, 10, 20]          # adaptive top-k after an insufficient round
  final_k: 8
  max_per_document: 3              # source diversity
  simple_strategy: LEXICAL         # research/phase9/calibrate_routing.py (simple-query fast path)
  exact_id_strategy: LEXICAL
  semantic_oov_ratio: 0.5
  rare_idf: 1.5
  requirement_coverage: 0.6
  min_gain: 0.05
  rerank: never                    # research/phase9 reranker evaluation
  rerank_max_candidates: 20
  expansion: true
  max_expansions: 3
  contradiction_retrieval: true
  claim_driven: true
  cache: true
  cache_max_entries: 256
  session_reuse: true
  filter_fields: [applicant_type, country, region, product, language]
  reference_date: null             # null = today (validity of "current" documents)
  tight_latency_ms: 150            # remaining budget below this -> fast path (cache / lexical, small k, one round)
  routing: true                    # ablation switches (research/phase9): strategy selection
  adaptive_k: true                 #   adaptive top-k (k by complexity, 5 -> 10 -> 20)
  iterative: true                  #   more than one retrieval round
  multi_hop: true                  #   hops through bridge statements
  temporal: true                   #   validity filtering / temporal conflict resolution
  authority:
    status: {current: 1.0, active: 1.0, draft: 0.4, superseded: 0.2, archived: 0.2, expired: 0.2}
    doc_type: {policy: 1.0, annex: 0.9, catalogue: 0.8, notice: 0.7, bulletin: 0.6}
  budget: {max_queries: 5, max_results: 40, max_iterations: 3, max_latency_ms: 1500, max_parallel_tasks: 2,
           max_hops: 2}
