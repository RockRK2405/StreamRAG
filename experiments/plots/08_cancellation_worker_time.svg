<svg xmlns="http://www.w3.org/2000/svg" class="s" width="720" height="214" viewBox="0 0 720 214" role="img" aria-label="Total worker time for the same overlapping turns (sum)"><style>
.s{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--base:#c3c2b7;
