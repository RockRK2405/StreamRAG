<svg xmlns="http://www.w3.org/2000/svg" class="s" width="720" height="184" viewBox="0 0 720 184" role="img" aria-label="Cache hit rate (conversation turns)"><style>
.s{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--base:#c3c2b7;
--c1:#2a78d6;--c2:#eb6834;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){.s{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;
--grid:#2c2c2a;--base:#383835;--c1:#3987e5;--c2:#d95926}}
.s .bg{fill:var(--surface)} .s .t{fill:var(--ink);font-size:14px;font-weight:600}
.s .sub{fill:var(--ink2);font-size:11px} .s .lab{fill:var(--ink2);font-size:11px}
.s .val{fill:var(--ink);font-size:11px;font-variant-numeric:tabular-nums} .s .ax{fill:var(--muted);font-size:10px}
.s .g{stroke:var(--grid);stroke-width:1} .s .b{stroke:var(--base);stroke-width:1}
.s .m1{fill:var(--c1)} .s .m2{fill:var(--c2)} .s .l1{stroke:var(--c1);fill:none;stroke-width:2;stroke-linejoin:round;
stroke-linecap:round} .s .l2{stroke:var(--c2);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.s .ring{stroke:var(--surface);stroke-width:2}
</style><rect class="bg" width="720" height="184"/><text class="t" x="16" y="24">Cache hit rate (conversation turns)</text><text class="sub" x="16" y="42">needs answered without any search</text><line class="g" x1="230.0" y1="54" x2="230.0" y2="156"/><text class="ax" x="230.0" y="170" text-anchor="middle">0.00</text><line class="g" x1="330.0" y1="54" x2="330.0" y2="156"/><text class="ax" x="330.0" y="170" text-anchor="middle">0.25</text><line class="g" x1="430.0" y1="54" x2="430.0" y2="156"/><text class="ax" x="430.0" y="170" text-anchor="middle">0.50</text><line class="g" x1="530.0" y1="54" x2="530.0" y2="156"/><text class="ax" x="530.0" y="170" text-anchor="middle">0.75</text><line class="g" x1="630.0" y1="54" x2="630.0" y2="156"/><text class="ax" x="630.0" y="170" text-anchor="middle">1.00</text><line class="b" x1="230" y1="54" x2="230" y2="156"/><text class="lab" x="222" y="73" text-anchor="end">no cache</text><path class="m1" d="M230,60 H230.0 Q230.0,60 230.0,60.0 V78.0 Q230.0,78 230.0,78 H230 Z"><title>no cache: 0.00</title></path><text class="val" x="236.0" y="73">0.00</text><text class="lab" x="222" y="103" text-anchor="end">query / session caches</text><path class="m1" d="M230,90 H251.0 Q255.0,90 255.0,94.0 V104.0 Q255.0,108 251.0,108 H230 Z"><title>query / session caches: 0.06</title></path><text class="val" x="261.0" y="103">0.06</text><text class="lab" x="222" y="133" text-anchor="end">adaptive</text><path class="m1" d="M230,120 H263.52 Q267.52,120 267.52,124.0 V134.0 Q267.52,138 263.52,138 H230 Z"><title>adaptive: 0.09</title></path><text class="val" x="273.52" y="133">0.09</text></svg>